services:
  mariadb:
    container_name: mariadb-galera
    image: advocase/mariadb-galera:local
    platform: linux/amd64 # production runs on amd64; pinned so local dev matches
    ports:
      - '3307:3306'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm:// # bootstraps a single-node cluster
      - MARIADB_USER=mariadb_suitecrm
      - MARIADB_DATABASE=mariadb_suitecrm
      - MARIADB_PASSWORD=mariadb123
    volumes:
      - 'mariadb_database:/bitnami/mariadb'
    networks:
      - suitecrm

networks:
  suitecrm:

volumes:
  mariadb_database:
    name: mariadb_database